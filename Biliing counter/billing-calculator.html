<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billing Calculator</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px;
    margin: 0;
  }
  .card {
    background: #fff;
    padding: 30px 32px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    width: 360px;
  }
  .footer {
    text-align: center;
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid #eee;
  }
  .footer .name {
    font-size: 13px;
    font-weight: 600;
    color: #555;
  }
  .footer .prn {
    font-size: 12px;
    color: #999;
    margin-top: 2px;
  }
  h2 {
    text-align: center;
    color: #333;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 22px;
  }
  .item-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .item-row input {
    flex: 1;
    min-width: 0;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    font-size: 14px;
  }
  .item-row input[type="number"] {
    flex: 0 0 60px;
  }
  #itemsList {
    margin: 15px 0;
    max-height: 150px;
    overflow-y: auto;
  }
  #itemsList div {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 6px;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.2s;
  }
  button:hover {
    background: #5468d4;
  }
  .reset-btn {
    background: #e74c3c;
  }
  .reset-btn:hover {
    background: #c0392b;
  }
  .totals {
    margin-top: 18px;
    border-top: 1px solid #ddd;
    padding-top: 12px;
  }
  .totals div {
    display: flex;
    justify-content: space-between;
    margin: 6px 0;
    font-size: 15px;
    color: #444;
  }
  .grand {
    font-weight: bold;
    font-size: 18px;
    color: #667eea;
  }
  label {
    font-size: 13px;
    color: #555;
    display: block;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  .small-input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>🧾 Billing Calculator</h2>

  <div class="item-row">
    <input type="text" id="itemName" placeholder="Item name">
    <input type="number" id="itemPrice" placeholder="Price">
    <input type="number" id="itemQty" placeholder="Qty" value="1">
  </div>
  <button onclick="addItem()">+ Add Item</button>

  <div id="itemsList"></div>

  <label>GST / Tax (%)</label>
  <input type="number" id="taxPercent" value="0" class="small-input">

  <label>Discount (%)</label>
  <input type="number" id="discountPercent" value="0" class="small-input">

  <button onclick="calculateBill()">Calculate Bill</button>
  <button onclick="resetBill()" class="reset-btn">Reset</button>

  <div class="totals">
    <div><span>Subtotal:</span><span id="subtotal">₹0.00</span></div>
    <div><span>Tax:</span><span id="taxAmt">₹0.00</span></div>
    <div><span>Discount:</span><span id="discAmt">₹0.00</span></div>
    <div class="grand"><span>Grand Total:</span><span id="grandTotal">₹0.00</span></div>
  </div>

  <div class="footer">
    <div class="name">Made by Adhiraj Kulkarni</div>
    <div class="prn">PRN: 24070521033</div>
  </div>
</div>

<script src="billing.js"></script>
</body>
</html>
