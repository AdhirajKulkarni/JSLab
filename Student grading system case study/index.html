<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h2>Welcome Back</h2>

    <form onsubmit="return validateForm()">
      <div class="input-box">
        <input type="text" placeholder="Username" required />
      </div>

      <div class="input-box">
        <input type="password" id="password" placeholder="Password" required />
        <span id="toggle">👁</span>
      </div>

      <button type="submit">Login</button>

      <div class="rules">
        <p id="length" class="invalid">❌ At least 8 characters</p>
        <p id="upper" class="invalid">❌ At least one uppercase letter</p>
        <p id="number" class="invalid">❌ At least one number</p>
        <p id="symbol" class="invalid">❌ At least one special character</p>
      </div>

      <div id="message" class="message"></div>

      <div class="student-info">
        Designed by: <strong>Adhiraj Kulkarni</strong><br />
        PRN: <strong>24070521033</strong>
      </div>

      <div class="footer">
        Don't have an account? <a href="#">Register</a>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
