<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Shopping Cart</h1>

    <section class="form-card">
      <h2>Add New Item</h2>
      <div class="form-row">
        <label for="itemName">Item name</label>
        <input id="itemName" type="text" placeholder="Example: Apple" />
      </div>
      <div class="form-row">
        <label for="itemPrice">Price</label>
        <input id="itemPrice" type="number" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div class="form-row">
        <label for="itemQuantity">Quantity</label>
        <input id="itemQuantity" type="number" min="1" step="1" value="1" />
      </div>
      <button id="addItemBtn">Add item</button>
    </section>

    <section class="cart-card">
      <h2>Your Cart</h2>
      <div class="cart-list" id="cartList">
        <p class="empty">Cart is empty. Add an item above.</p>
      </div>

      <div class="coupon-row">
        <input id="couponCode" type="text" placeholder="Enter coupon code" />
        <button id="applyCouponBtn">Apply coupon</button>
      </div>
      <p class="coupon-message" id="couponMessage"></p>

      <div class="totals">
        <div><span>Subtotal</span><span id="subtotalAmount">$0.00</span></div>
        <div><span>Discount</span><span id="discountAmount">$0.00</span></div>
        <div class="grand-total"><span>Total</span><span id="totalAmount">$0.00</span></div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
